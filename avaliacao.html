<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmação de Avaliação</title>
    <link rel="stylesheet" href="css/estilo.css">
    <script src="avaliacao.js" defer></script>
</head>
<body>
    <header>
        <h1>Obrigado pela sua Avaliação!</h1>
    </header>

    <main class="confirmation-container">
        <div class="confirmation-card">
            <h2>Sua avaliação foi enviada com sucesso.</h2>
            <p>Agradecemos por dedicar seu tempo para nos ajudar a melhorar nossos produtos.</p>
            
            <div class="counter-box">
                <p>Número total de avaliações enviadas neste navegador:</p>
                <span id="reviewCount" class="count-number">0</span>
            </div>

            <a href="formulario.html" class="btn-back">Enviar outra avaliação</a>
        </div>
    </main>

    <footer>
        <p>&copy;<span id="year"></span> Lavínia Morais de Jesus | Goiás, Brasil</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
