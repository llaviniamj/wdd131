<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tecelão de Histórias | Contato</title>
  <link rel="stylesheet" href="estilos/projetofinal.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <h1>Tecelão de Histórias</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="estante.html">Estante Virtual</a></li>
        <li><a href="contato.html" class="active">Contato</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="form-container">
      <h2 style="font-family: var(--font-heading); color: var(--primary); margin-bottom: 1rem; text-align: center;">Sugira uma Leitura / Entre em Contato</h2>
      
      <form onsubmit="event.preventDefault(); alert('Mensagem enviada com sucesso!');">
        <div class="form-group">
          <label for="nome">Nome Completo:</label>
          <input type="text" id="nome" required placeholder="Seu nome completo">
        </div>

        <div class="form-group">
          <label for="email">E-mail de Contato:</label>
          <input type="email" id="email" required placeholder="seu@email.com">
        </div>

        <div class="form-group">
          <label for="assunto">Assunto:</label>
          <select id="assunto">
            <option value="sugestao">Sugestão de Livro</option>
            <option value="duvida">Dúvida sobre o Clube</option>
            <option value="outro">Outro</option>
          </select>
        </div>

        <div class="form-group">
          <label for="mensagem">Mensagem:</label>
          <textarea id="mensagem" rows="5" required placeholder="Escreva sua recomendação ou mensagem..."></textarea>
        </div>

        <button type="submit" class="btn">Enviar Mensagem</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Tecelão de Histórias. Todos os direitos reservados.</p>
    <p><a href="referencias.html">Página de Referências e Fontes</a></p>
  </footer>

  <script src="scripts/projetofinal.js"></script>
</body>
</html>
