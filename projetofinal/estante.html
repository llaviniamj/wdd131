<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tecelão de Histórias | Estante Virtual</title>
  <link rel="stylesheet" href="estilos/projetofinal.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <h1>Tecelão de Histórias</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="estante.html" class="active">Estante Virtual</a></li>
        <li><a href="contato.html">Contato</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2 style="font-family: var(--font-heading); color: var(--primary);">Catálogo de Leituras</h2>
    
    <div class="form-group" style="max-width: 300px; margin: 1rem 0 2rem 0;">
      <label for="filtro-genero">Filtrar por Gênero:</label>
      <select id="filtro-genero">
        <option value="todos">Todos os Gêneros (50 Livros)</option>
        <option value="fantasia">Fantasia & Sagas</option>
        <option value="ficcao">Ficção Científica</option>
        <option value="romance">Romance</option>
        <option value="misterio">Mistério & Suspense</option>
    </select>
    </div>

    <section id="container-catalogo" class="grid-cards">
    </section>

    <hr style="margin: 3rem 0; border: none; border-top: 2px dashed var(--accent);">

    <h2 style="font-family: var(--font-heading); color: var(--primary);">Minha Estante Virtual</h2>
    <p style="margin-bottom: 1rem;">Os livros salvos abaixo permanecem salvos no seu navegador através do <code>localStorage</code>.</p>
    
    <section id="container-estante" class="grid-cards">
    </section>
  </main>

    <p>&copy; 2026 Tecelão de Histórias. Todos os direitos reservados.</p>
